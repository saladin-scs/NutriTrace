services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutritrace-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nutritrace
      DB_USERNAME: nutritrace
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: nutritrace-mysql
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: nutritrace
      MYSQL_USER: nutritrace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - nutritrace_mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nutritrace-redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - nutritrace_redis:/data
    restart: unless-stopped

  # Optional legacy AI stub — not required for Control Tower
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: nutritrace-ollama
    ports:
      - "11434:11434"
    volumes:
      - nutritrace_ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  nutritrace_mysql:
  nutritrace_redis:
  nutritrace_ollama_data:
